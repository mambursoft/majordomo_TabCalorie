<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="TabCalorie">
  <defs>
    <linearGradient id="tcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5C45"/>
      <stop offset="1" stop-color="#1B8A5B"/>
    </linearGradient>
    <linearGradient id="tcAccent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F4702E"/>
      <stop offset="1" stop-color="#F6B73C"/>
    </linearGradient>
    <linearGradient id="tcCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF7F0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tcBg)"/>
  <rect x="8" y="10" width="48" height="44" rx="7" fill="url(#tcCard)"/>

  <!-- Таблиця / щоденник -->
  <rect x="12" y="14" width="40" height="9" rx="3" fill="#CDEBDC"/>
  <g stroke="#BFE0D0" stroke-width="1.4">
    <line x1="25" y1="14" x2="25" y2="50"/>
    <line x1="38" y1="14" x2="38" y2="50"/>
    <line x1="12" y1="28" x2="52" y2="28"/>
    <line x1="12" y1="39" x2="52" y2="39"/>
  </g>

  <!-- Графік споживання (росте) -->
  <polyline points="14,45 22,37 30,41 38,30 44,24" fill="none"
            stroke="url(#tcAccent)" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="24" r="2.6" fill="#F4702E"/>

  <!-- Стилізована ложка -->
  <g transform="rotate(-28 47 49)">
    <rect x="45.4" y="36" width="3.2" height="13" rx="1.6" fill="#F5A623"/>
    <ellipse cx="47" cy="51" rx="4.4" ry="6" fill="url(#tcAccent)"/>
  </g>
</svg>
